<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPA & CGPA Calculator</title>
  <meta name="google-site-verification" content="XJK7RJEF9HIBYEuhaN7U-khhMh0QTopwhVCkjrflLzs" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4801656588223289"
     crossorigin="anonymous"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    .wrapper { max-width: 650px; margin: 0 auto; }
    .nav { display: flex; gap: 15px; margin-bottom: 20px; }
    .nav a { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 14px; }
    .nav a:hover { text-decoration: underline; }
    .card { background: var(--card-bg); padding: 24px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h1 { font-size: 22px; margin-bottom: 8px; color: var(--text); }
    p { font-size: 14px; color: #475569; margin-bottom: 20px; }
    .course-row { display: flex; gap: 10px; margin-bottom: 12px; }
    input, select { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; flex: 1; width: 100%; }
    button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
    .result { margin-top: 20px; padding: 15px; background: #e0e7ff; color: #3730a3; border-radius: 6px; text-align: center; font-weight: 700; font-size: 18px; display: none; }
  </style>
</head>
<body>

  <div class="wrapper">
    <nav class="nav">
      <a href="about.html">About Us</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>

    <div class="card">
      <h1>GPA & CGPA Calculator</h1>
      <p>Enter your course credit units and grades below to compute your grade point average instantly.</p>

      <div id="course-list">
        <div class="course-row">
          <input type="text" placeholder="Course Name (Optional)">
          <input type="number" class="units" placeholder="Units (e.g. 3)" min="1">
          <select class="grade">
            <option value="5">A (5.0)</option>
            <option value="4">B (4.0)</option>
            <option value="3">C (3.0)</option>
            <option value="2">D (2.0)</option>
            <option value="1">E (1.0)</option>
            <option value="0">F (0.0)</option>
          </select>
        </div>
      </div>

      <button type="button" onclick="addCourse()" style="background: #64748b; margin-bottom: 10px;">+ Add Another Course</button>
      <button type="button" onclick="calculateGPA()">Calculate GPA</button>

      <div id="result-box" class="result"></div>
    </div>
  </div>

  <script>
    function addCourse() {
      const container = document.getElementById('course-list');
      const row = document.createElement('div');
      row.className = 'course-row';
      row.innerHTML = `
        <input type="text" placeholder="Course Name (Optional)">
        <input type="number" class="units" placeholder="Units" min="1">
        <select class="grade">
          <option value="5">A (5.0)</option>
          <option value="4">B (4.0)</option>
          <option value="3">C (3.0)</option>
          <option value="2">D (2.0)</option>
          <option value="1">E (1.0)</option>
          <option value="0">F (0.0)</option>
        </select>
      `;
      container.appendChild(row);
    }

    function calculateGPA() {
      const units = document.querySelectorAll('.units');
      const grades = document.querySelectorAll('.grade');
      let totalPoints = 0;
      let totalUnits = 0;

      for (let i = 0; i < units.length; i++) {
        const u = parseFloat(units[i].value);
        const g = parseFloat(grades[i].value);
        if (!isNaN(u) && u > 0) {
          totalPoints += u * g;
          totalUnits += u;
        }
      }

      const resBox = document.getElementById('result-box');
      if (totalUnits > 0) {
        const gpa = (totalPoints / totalUnits).toFixed(2);
        resBox.innerText = `Your GPA: ${gpa} (Total Units: ${totalUnits})`;
        resBox.style.display = 'block';
      } else {
        alert('Please enter valid credit units for at least one course.');
      }
    }
  </script>
</body>
</html>
